#:schema node_modules/wrangler/config-schema.json
name = "marketing-cdn"
main = "src/index.js"
account_id = "1df4880142e9b3ccb4341bf7e97c57ff"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# Import admin UI templates as text modules (avoids nested JS template literals).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[routes]]
pattern = "files.point.com"
zone_name = "point.com"
custom_domain = true
enabled = true
previews_enabled = false

# Bind an R2 Bucket for CDN storage
[[r2_buckets]]
binding = "CDN_BUCKET"
bucket_name = "marketing-cdn"

[vars]
CDN_PUBLIC_BASE = "https://files.point.com"
CF_ZONE_ID = "794e396a93d8d8a7ab4cebef200ff64f"

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.
