#:schema node_modules/wrangler/config-schema.json
name = "marketing-cdn"
main = "src/index.js"
account_id = "1df4880142e9b3ccb4341bf7e97c57ff"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Import admin UI templates as text modules (avoids nested JS template literals).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Custom domain configuration
# routes = [
#    { pattern = "files.point.com", custom_domain = true }
#]

# Bind an R2 Bucket for CDN storage
[[r2_buckets]]
binding = "CDN_BUCKET"
bucket_name = "marketing-cdn"

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.
