<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files - Point CDN</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 28px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        h1 {
            color: #1a1a1a;
            margin: 0;
            font-size: 1.6rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .search-container {
            flex: 1;
            min-width: 220px;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e2e2;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        .search-input:focus {
            outline: none;
            border-color: #007bff;
            background: white;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }
        .stats-bar {
            font-size: 13px;
            color: #888;
            margin-bottom: 14px;
            font-weight: 500;
        }
        .file-list {
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            overflow: hidden;
            background: #fafafa;
        }
        .file-item {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
        }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: #f5f8ff; }
        .file-info {
            min-width: 0;
        }
        .file-name {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', Consolas, monospace;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-url {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', Consolas, monospace;
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .file-date {
            font-size: 12px;
            color: #bbb;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .copy-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .copy-btn:hover { background: #0056b3; transform: translateY(-1px); }
        .copy-btn.copied { background: #28a745; }
        .file-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .replace-btn {
            background: white;
            color: #007bff;
            border: 1px solid #007bff;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .replace-btn:hover { background: #f0f6ff; }
        .replace-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .no-files {
            text-align: center;
            padding: 48px 20px;
            color: #aaa;
            font-size: 15px;
        }
        .loading {
            text-align: center;
            padding: 48px 20px;
            color: #aaa;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #f0f0f0;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 7px 14px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .nav-links a:hover { background: #f0f6ff; }
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .header-section { gap: 12px; }
            .file-item { grid-template-columns: 1fr auto; grid-template-rows: auto auto; }
            .file-date { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h1>Point CDN Files</h1>
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Search files..." autocomplete="off">
            </div>
        </div>
        <p style="font-size: 13px; color: #888; margin: -8px 0 16px;">Uploads never overwrite an existing URL. Use Replace to keep the same link.</p>

        <div id="stats" class="stats-bar">Loading...</div>

        <div id="file-list" class="file-list">
            <div class="loading">Loading files...</div>
        </div>

        <div class="nav-links">
            <a href="/upload">Upload Files</a>
            <a href="/code">Code Browser</a>
        </div>
    </div>
    <input type="file" id="replace-input" hidden>

    <script>
        const searchInput = document.getElementById('search-input');
        const fileList = document.getElementById('file-list');
        const statsEl = document.getElementById('stats');
        const replaceInput = document.getElementById('replace-input');
        const MAX_UPLOAD_BYTES = 100 * 1024 * 1024;
        let searchTimeout;
        let pendingReplace = null;

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDate(isoString) {
            if (!isoString) return '';
            return new Date(isoString).toLocaleString(undefined, {
                month: 'short', day: 'numeric', year: 'numeric',
            });
        }

        function copyToClipboard(url, btn) {
            navigator.clipboard.writeText(url).then(() => {
                const orig = btn.textContent;
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
            }).catch(() => {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = url;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                const orig = btn.textContent;
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
            });
        }

        function fileExtension(name) {
            const lastDot = String(name || '').lastIndexOf('.');
            if (lastDot <= 0) return '';
            return name.slice(lastDot + 1).toLowerCase();
        }

        async function replaceFile(key, file) {
            const body = new FormData();
            body.append('file', file);
            body.append('key', key);
            const res = await fetch('/api/replace-file', { method: 'POST', body });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.error || 'Replace failed');
            }
            return data;
        }

        replaceInput.addEventListener('change', async () => {
            const file = replaceInput.files && replaceInput.files[0];
            const target = pendingReplace;
            replaceInput.value = '';
            pendingReplace = null;
            if (!file || !target) return;

            if (file.size > MAX_UPLOAD_BYTES) {
                alert('File is larger than the 100 MB limit.');
                return;
            }
            if (fileExtension(file.name) !== fileExtension(target.key)) {
                const ext = fileExtension(target.key);
                alert(ext
                    ? 'Replacement must keep the .' + ext + ' extension so the URL still works.'
                    : 'Replacement must also have no file extension so the URL still works.');
                return;
            }
            if (!confirm('Replace ' + target.key + '? The public URL stays the same and the current file is overwritten.')) {
                return;
            }

            statsEl.textContent = 'Replacing ' + target.key + '…';
            try {
                const result = await replaceFile(target.key, file);
                await loadFiles(searchInput.value);
                if (result.cacheSkipped) {
                    statsEl.textContent = 'Replaced ' + target.key + ' (cache purge is not configured)';
                } else if (!result.cachePurged) {
                    statsEl.textContent = 'Replaced ' + target.key + ' (cache purge failed — it may take time to appear)';
                } else {
                    statsEl.textContent = 'Replaced ' + target.key;
                }
            } catch (err) {
                alert(err instanceof Error ? err.message : 'Replace failed');
                statsEl.textContent = 'Replace failed';
            }
        });

        async function loadFiles(search = '') {
            fileList.innerHTML = '<div class="loading">Loading...</div>';
            statsEl.textContent = '';
            try {
                const res = await fetch('/api/browse-files?search=' + encodeURIComponent(search));
                const data = await res.json();
                const files = data.files || [];

                if (files.length === 0) {
                    fileList.innerHTML = '<div class="no-files">' + (search ? 'No files match "' + escapeHtml(search) + '"' : 'No files found') + '</div>';
                    statsEl.textContent = search ? 'No results' : '0 files';
                    return;
                }

                statsEl.textContent = files.length + ' file' + (files.length === 1 ? '' : 's') + (search ? ' matching "' + search + '"' : '');

				fileList.innerHTML = files.map(f => {
                    const encodedUrl = f.url;
                    const name = f.key || decodeURIComponent(f.url.split('/').pop());
                    const date = formatDate(f.lastModified);
                    const replaceBtn = f.replaceable
                        ? `<button class="replace-btn" data-key="${escapeHtml(name)}" type="button">Replace</button>`
                        : '';
                    return `<div class="file-item">
                        <div class="file-info">
                            <div class="file-name">${escapeHtml(name)}</div>
                            <div class="file-url">${escapeHtml(encodedUrl)}</div>
                        </div>
                        <div class="file-date">${escapeHtml(date)}</div>
                        <div class="file-actions">
                            ${replaceBtn}
                            <button class="copy-btn" data-url="${escapeHtml(encodedUrl)}" type="button">Copy URL</button>
                        </div>
                    </div>`;
                }).join('');

                // Attach copy handlers after rendering (avoids inline onclick issues with special chars)
                fileList.querySelectorAll('.copy-btn[data-url]').forEach(btn => {
                    btn.addEventListener('click', () => copyToClipboard(btn.dataset.url, btn));
                });
                fileList.querySelectorAll('.replace-btn[data-key]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        pendingReplace = { key: btn.dataset.key };
                        replaceInput.click();
                    });
                });
            } catch (err) {
                fileList.innerHTML = '<div class="no-files">Error loading files</div>';
                statsEl.textContent = 'Error';
            }
        }

        loadFiles();

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadFiles(searchInput.value), 300);
        });
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { clearTimeout(searchTimeout); loadFiles(searchInput.value); }
        });
    </script>
</body>
</html>
